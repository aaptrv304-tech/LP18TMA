<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FF6B35">
    <title>Апельсинчик - Главная</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B35',
                        secondary: '#FFF8E7',
                        textPrimary: '#2C2C2C',
                        textSecondary: '#666666',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: contain;
        }

        .gradient-card {
            background: linear-gradient(135deg, #E65A2B 0%, #F59A65 50%, #FFD9C4 100%);
        }

        .business-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .business-card:active {
            transform: scale(0.98);
        }

        .category-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>

<body class="bg-[#FAFAFA]">
    <div id="app-container" class="w-full bg-white min-h-screen pb-[76px]">

        <!-- Header -->
        <header id="header" <header id="header"
            class="bg-white px-3 py-2 flex items-center justify-between shadow-sm border-b border-gray-100">
            <div class="flex items-center gap-2">
                <div
                    class="w-8 h-8 bg-gradient-to-br from-primary to-orange-400 rounded-lg flex items-center justify-center">
                    <div class="w-4 h-4 border-2 border-white rounded transform rotate-45"></div>
                </div>
                <span class="text-lg font-bold text-textPrimary">Апельсинчик v0.2</span>
            </div>
            <button class="w-8 h-8 flex items-center justify-center relative">
                <i class="fa-regular fa-bell text-lg text-textPrimary"></i>
                <span class="absolute top-0.5 right-0.5 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
            </button>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="pt-4">

            <!-- Summary Card -->
            <section id="summary-card-section" class="px-4 pt-4 pb-6">
                <div class="gradient-card rounded-2xl p-6 shadow-lg">
                    <!-- Будет заполнено с сервера -->
                </div>
            </section>

            <!-- Filter Section -->
            <section id="filter-section" class="px-4 pb-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-textPrimary text-xl font-bold">Мои заведения</h2>
                    <button class="flex items-center gap-1 text-textSecondary text-sm font-medium">
                        <span>По балансу</span>
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </button>
                </div>
                <div class="flex gap-2 overflow-x-auto pb-2">
                    <button class="px-4 py-2 bg-primary text-white rounded-full text-sm font-medium whitespace-nowrap">
                        Все
                    </button>
                    <button
                        class="px-4 py-2 bg-white border border-gray-200 text-textSecondary rounded-full text-sm font-medium whitespace-nowrap flex items-center gap-1">
                        <i class="fa-solid fa-star text-yellow-500 text-xs"></i>
                        Любимые
                    </button>
                    <button
                        class="px-4 py-2 bg-white border border-gray-200 text-textSecondary rounded-full text-sm font-medium whitespace-nowrap">
                        Недавние
                    </button>
                </div>
            </section>

            <!-- Business List -->
            <section id="business-list-section" class="px-4 pb-4 space-y-3">
                <!-- Будет заполнено с сервера -->
            </section>

            <!-- Quick Actions -->
            <section id="quick-actions-section" class="px-4 pb-4">
                <div class="bg-gradient-to-r from-orange-50 to-amber-50 rounded-2xl p-4 border border-orange-100">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center">
                            <i class="fa-solid fa-qrcode text-primary text-lg"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="text-textPrimary font-semibold text-sm">Быстрое начисление</h3>
                            <p class="text-textSecondary text-xs">Покажите QR-код кассиру</p>
                        </div>
                        <button class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-medium">
                            Открыть
                        </button>
                    </div>
                </div>
            </section>

            <!-- Achievements -->
            <section id="achievements-section" class="px-4 pb-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-textPrimary text-lg font-bold">Достижения</h2>
                    <button class="text-primary text-sm font-medium">Все</button>
                </div>
                <div class="flex gap-3 overflow-x-auto pb-2" id="achievements-container">
                    <!-- Будет заполнено с сервера -->
                </div>
            </section>

            <!-- Recommendations -->
            <section id="recommendations-section" class="px-4 pb-4">
                <h2 class="text-textPrimary text-lg font-bold mb-3">Рекомендуем посетить</h2>
                <div class="space-y-3" id="recommendations-container">
                    <!-- Будет заполнено с сервера -->
                </div>
            </section>

            <!-- Recent Activity -->
            <section id="recent-activity-section" class="px-4 pb-4">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-textPrimary text-lg font-bold">Последняя активность</h2>
                    <button class="text-primary text-sm font-medium">История</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 divide-y divide-gray-100"
                    id="activity-container">
                    <!-- Будет заполнено с сервера -->
                </div>
            </section>

            <!-- Tips -->
            <section id="tips-section" class="px-4 pb-6">
                <div class="bg-gradient-to-br from-blue-50 to-purple-50 rounded-2xl p-4 border border-blue-100">
                    <div class="flex gap-3">
                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-lightbulb text-blue-600 text-lg"></i>
                        </div>
                        <div>
                            <h3 class="text-textPrimary font-semibold text-sm mb-1">Совет дня</h3>
                            <p class="text-textSecondary text-xs leading-relaxed">Не забудьте использовать накопленные
                                баллы! В Салоне Красоты Люкс доступна награда.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-50">
            <div class="flex items-center justify-around h-[76px] px-2">
                <button class="flex flex-col items-center justify-center gap-1 flex-1 py-2 text-primary">
                    <i class="fa-solid fa-house text-xl"></i>
                    <span class="text-xs font-medium">Главная</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 flex-1 py-2 text-textSecondary">
                    <i class="fa-solid fa-gift text-xl"></i>
                    <span class="text-xs font-medium">Награды</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 flex-1 py-2 text-textSecondary">
                    <i class="fa-solid fa-clock-rotate-left text-xl"></i>
                    <span class="text-xs font-medium">История</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 flex-1 py-2 text-textSecondary">
                    <i class="fa-solid fa-user text-xl"></i>
                    <span class="text-xs font-medium">Профиль</span>
                </button>
            </div>
        </nav>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.ts"></script>

    <!-- Loader Overlay -->
    <div id="loader-overlay" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin mb-4 mx-auto">
            </div>
            <p class="text-textSecondary text-sm">Загрузка данных...</p>
        </div>
    </div>

</body>

</html>
