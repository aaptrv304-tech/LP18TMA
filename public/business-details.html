<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FF6B35">
    <title>Кофейня Уют - Детали</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6B35',
                        secondary: '#FFF8E7',
                        textPrimary: '#2C2C2C',
                        textSecondary: '#666666',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overscroll-behavior-y: contain;
            background-color: #FAFAFA;
        }

        .hero-gradient {
            background: linear-gradient(135deg, #FF6B35 0%, #FFB88C 50%, #FFF8E7 100%);
        }

        .reward-card {
            transition: transform 0.2s;
        }

        .reward-card:active {
            transform: scale(0.98);
        }

        .info-card {
            transition: all 0.2s;
        }

        .info-card:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <!-- 🔥 УБРАЛИ ВНЕШНИЙ КОНТЕЙНЕР #business-details-screen 🔥 -->

    <!-- Контейнер -->
    <div id="app-container" class="w-full max-w-[375px] mx-auto bg-white min-h-screen pb-[76px]">

        <!-- Hero Header -->
        <section id="hero-header" class="relative h-[280px] overflow-hidden">
            <div class="hero-gradient absolute inset-0"></div>

            <!-- Back Button -->
            <button id="back-button"
                class="absolute top-4 left-4 z-20 w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-arrow-left text-white text-lg"></i>
            </button>

            <!-- Favorite Button -->
            <button id="favorite-button"
                class="absolute top-4 right-4 z-20 w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-star text-yellow-400 text-lg"></i>
            </button>

            <div class="absolute bottom-0 left-0 right-0 p-6 pb-8">
                <div class="flex items-end gap-4">
                    <div
                        class="w-20 h-20 bg-white rounded-full flex items-center justify-center text-primary text-3xl font-bold shadow-xl border-4 border-white flex-shrink-0">
                        К
                    </div>
                    <div class="flex-1 pb-1">
                        <h1 class="text-white text-2xl font-bold mb-2 leading-tight">Кофейня Уют</h1>
                        <div class="flex items-center gap-2 mb-2">
                            <span
                                class="px-2 py-1 bg-white/20 backdrop-blur-md text-white rounded-lg text-xs font-medium flex items-center gap-1">
                                <span>☕</span><span>Кафе</span>
                            </span>
                        </div>
                        <div class="flex items-center gap-1">
                            <i class="fa-solid fa-star text-yellow-400 text-sm"></i>
                            <span class="text-white font-semibold text-sm">4.8</span>
                            <span class="text-white/80 text-xs ml-1">(120 отзывов)</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Main Content -->
        <main id="main-content" class="relative -mt-4 bg-white rounded-t-3xl">
            <!-- ... ВСЁ ОСТАЛЬНОЕ СОДЕРЖИМОЕ БЕЗ ИЗМЕНЕНИЙ ... -->

            <!-- Info Cards, User Stats, Rewards, Quick Actions, About, Reviews, Location, Social, Share -->
            <!-- ... (копируйте всё остальное содержимое из предыдущего файла) ... -->

        </main>

        <!-- Bottom Navigation -->
        <nav id="bottom-nav"
            class="fixed bottom-0 left-0 right-0 max-w-[375px] mx-auto bg-white border-t border-gray-200 z-50">
            <div class="flex items-center justify-around h-[76px] px-2">
                <button
                    class="flex flex-col items-center justify-center gap-1 flex-1 py-2 text-textSecondary text-primary">
                    <i class="fa-solid fa-house text-xl"></i>
                    <span class="text-xs font-medium">Главная</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 flex-1 py-2 text-textSecondary">
                    <i class="fa-solid fa-gift text-xl"></i>
                    <span class="text-xs font-medium">Награды</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 flex-1 py-2 text-textSecondary">
                    <i class="fa-solid fa-clock-rotate-left text-xl"></i>
                    <span class="text-xs font-medium">История</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 flex-1 py-2 text-textSecondary">
                    <i class="fa-solid fa-user text-xl"></i>
                    <span class="text-xs font-medium">Профиль</span>
                </button>
            </div>
        </nav>

        <!-- Telegram WebApp Script -->
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
    </div>
</body>

</html>
